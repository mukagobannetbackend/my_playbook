{% extends 'base.html' %}{% block title %}Choose a new password{% endblock %}{% block auth_content %}<section class="auth-card"><div class="auth-kicker">A FRESH START</div><h1>Choose a new password.</h1><p class="auth-description">This link is private to you and will only work once.</p><form method="post" class="auth-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="password">New password<input id="password" name="password" type="password" minlength="10" autocomplete="new-password" required autofocus><small>At least 10 characters.</small></label><label for="confirm_password">Confirm new password<input id="confirm_password" name="confirm_password" type="password" minlength="10" autocomplete="new-password" required></label><button class="button button-primary button-wide" type="submit">Save new password <span>→</span></button></form></section>{% endblock %}
