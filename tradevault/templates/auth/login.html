{% extends 'base.html' %}{% block title %}Sign in{% endblock %}{% block auth_content %}<section class="auth-card"><div class="auth-kicker">YOUR PRIVATE SPACE</div><h1>Good to have you back.</h1><p class="auth-description">Your notes and screenshots are waiting right where you left them.</p><form method="post" class="auth-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="email">Email address<input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required autofocus></label><label for="password">Password<span class="label-side"><a href="{{ url_for('auth.forgot_password') }}">Forgot?</a></span><input id="password" name="password" type="password" autocomplete="current-password" required></label><button class="button button-primary button-wide" type="submit">Sign in <span>→</span></button></form><p class="auth-switch">New to TradeVault? <a href="{{ url_for('auth.register') }}">Create an account</a></p></section>{% endblock %}
